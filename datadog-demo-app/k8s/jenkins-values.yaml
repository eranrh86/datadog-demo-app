controller:
  # Use LTS image
  image:
    tag: "lts"

  # Admin credentials
  admin:
    username: "admin"
    password: "datadog-demo-2026"

  # Expose via LoadBalancer
  serviceType: LoadBalancer
  servicePort: 8080

  # Resource limits suitable for spot nodes
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # JVM options
  javaOpts: "-Xms512m -Xmx1g"

  # Mount Datadog API key from K8s secret as env var
  # (secret created separately via: kubectl create secret)
  containerEnv:
    - name: DATADOG_API_KEY
      valueFrom:
        secretKeyRef:
          name: datadog-jenkins-secret
          key: api-key

  # Install plugins (no version pins — let update center resolve compatible versions)
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - datadog
    - junit
    - pipeline-stage-view
    - credentials-binding
    - job-dsl

  # Disable setup wizard (JCasC handles config)
  numExecutors: 0

  # Jenkins Configuration as Code
  JCasC:
    defaultConfig: true
    configScripts:
      datadog-config: |
        unclassified:
          datadogGlobalConfiguration:
            targetApiKey: "${DATADOG_API_KEY}"
            targetHost: "datadog-agent.datadog.svc.cluster.local"
            targetPort: 8125
            targetTraceCollectionPort: 8126
            reportWith: "DSD"
            enableCiVisibility: true
            ciInstanceName: "karpenter-demo"
            collectBuildLogs: true
            collectBuildTraces: true
            emitConfigChangeEvents: true
            emitSecurityEvents: true
            emitSystemEvents: true
            traceServiceName: "jenkins"
            targetApiURL: "https://api.datadoghq.com/api/"

      credentials-config: |
        credentials:
          system:
            domainCredentials:
            - credentials:
              - string:
                  scope: GLOBAL
                  id: "datadog-api-key"
                  secret: "${DATADOG_API_KEY}"
                  description: "Datadog API Key"


agent:
  enabled: true
  podName: jenkins-agent
  customJenkinsLabels:
    - k8s-agent
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  namespace: jenkins

persistence:
  enabled: true
  size: "8Gi"
  storageClass: ""

serviceAccount:
  create: true
  name: jenkins

rbac:
  create: true
  readSecrets: true
