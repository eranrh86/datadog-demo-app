<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Sentiment — StockLens</title>

  <style>
    /* ── Design tokens (match existing StockLens dark theme) ── */
    :root {
      --bg:         #0f172a;
      --card:       #1e293b;
      --card-inner: #0f172a;
      --accent:     #3b82f6;
      --text:       #f1f5f9;
      --text-muted: #64748b;
      --border:     #334155;
      --radius:     12px;
      --radius-sm:  6px;
      --bull:       #22c55e;
      --bear:       #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }

    /* ══ Social card (drop into renderAnalysis) ══════════════════ */
    .social-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      width: 100%;
      max-width: 460px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    /* ── X logo badge ── */
    .x-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      background: #000;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      font-family: 'Georgia', serif;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── Sentiment bar ── */
    .sr-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .sr-bull-text { color: var(--bull); }
    .sr-bear-text { color: var(--bear); }

    .sr-bar {
      display: flex;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .sr-bull { background: var(--bull); border-radius: 3px 0 0 3px; }
    .sr-bear { background: var(--bear); border-radius: 0 3px 3px 0; }

    /* ══ CSS ─ tweet-list, tweet, tweet-actions, x-search-btn ══ */

    .tweet-list { display: flex; flex-direction: column; gap: 10px; }

    .tweet {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      transition: border-color .15s;
    }
    .tweet:hover { border-color: #475569; }

    .tweet-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .tweet-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #fff;
      flex-shrink: 0;
    }

    .tweet-user {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }

    /* tweet-verified badge */
    .tweet-verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      background: #1d9bf0;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tweet-verified::after {
      content: '✓';
      font-size: 9px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .tweet-sentiment {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
    }
    .tweet-sentiment.bull { color: var(--bull); }
    .tweet-sentiment.bear { color: var(--bear); }

    .tweet-text {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 8px;
    }

    /* tweet-actions: likes, retweets, timestamp, link */
    .tweet-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .tweet-actions .action {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tweet-actions .action svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      opacity: .7;
    }
    .tweet-ts { margin-left: auto; font-size: 11px; }
    .tweet-xlink {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #60a5fa;
      text-decoration: none;
      transition: color .15s;
    }
    .tweet-xlink:hover { color: #93c5fd; }

    /* x-search-btn */
    .x-search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      margin-top: 14px;
      padding: 9px 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .x-search-btn:hover {
      border-color: #475569;
      color: var(--text);
      background: rgba(255,255,255,.03);
    }
    .x-search-btn .x-logo { width: 15px; height: 15px; font-size: 9px; }
  </style>
</head>
<body>

<!-- ============================================================
     Social Sentiment Widget — drop .social-card into renderAnalysis
     ============================================================ -->
<div id="socialMount"></div>

<script>
/* ============================================================
   JS_FUNCTION — getSocialSentiment(sym)
   No API calls. Deterministic seed so same ticker = same data.
   Returns real X search links per post + aggregate search button.
   ============================================================ */
function stockSeed(sym) {
  let h = 0;
  for (let i = 0; i < sym.length; i++) h = (Math.imul(31, h) + sym.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}

function getSocialSentiment(sym) {
  const r      = seededRandom(stockSeed(sym) + 42);
  const bull   = 30 + r() * 50;
  const xBase  = `https://x.com/search?q=%24${sym}`;
  const fLive  = '&f=live';

  // Keyword drives the per-post contextual X search link
  const msgs = [
    {
      user: 'zerohedge_tr',  verified: false, bull: true,
      text: `$${sym} breakout forming on the daily — volume confirming. Watching the 50-day closely.`,
      keyword: 'breakout',
      ts: `${2 + (stockSeed(sym) % 4)}h ago`,
      likes: 140 + (stockSeed(sym) % 860), retweets: 18 + (stockSeed(sym) % 120),
    },
    {
      user: 'markets_arb',   verified: true,  bull: false,
      text: `$${sym} PE premium hard to justify here. Waiting for a 12–15% pullback before sizing in.`,
      keyword: 'overvalued',
      ts: `${5 + (stockSeed(sym) % 6)}h ago`,
      likes: 88 + (stockSeed(sym) % 400),  retweets: 9  + (stockSeed(sym) % 55),
    },
    {
      user: 'optflow_hawk',  verified: true,  bull: true,
      text: `Unusual call sweep on $${sym} — 10k contracts, 3-week expiry. Institutional accumulation signal.`,
      keyword: 'options',
      ts: `${1 + (stockSeed(sym) % 3)}h ago`,
      likes: 310 + (stockSeed(sym) % 1200), retweets: 47 + (stockSeed(sym) % 200),
    },
    {
      user: 'long_only_cap', verified: false, bull: true,
      text: `Added to $${sym} position on the dip. Long-term thesis unchanged — management executing well.`,
      keyword: 'accumulate',
      ts: `${20 + (stockSeed(sym) % 30)}m ago`,
      likes: 55  + (stockSeed(sym) % 280),  retweets: 6  + (stockSeed(sym) % 40),
    },
    {
      user: 'bearish_edge',  verified: false, bull: false,
      text: `$${sym} Q4 guide came in light. Hard to see margin expansion at this multiple. $${sym} puts.`,
      keyword: 'earnings',
      ts: `${3 + (stockSeed(sym) % 8)}h ago`,
      likes: 72  + (stockSeed(sym) % 350),  retweets: 11 + (stockSeed(sym) % 70),
    },
  ];

  // Attach per-post X search URL using a keyword from the text
  msgs.forEach(m => {
    m.xLink = `${xBase}+${encodeURIComponent(m.keyword)}${fLive}`;
  });

  return {
    bullPct:     +bull.toFixed(1),
    bearPct:     +(100 - bull).toFixed(1),
    messages:    msgs,
    searchLink:  `${xBase}&src=typed_query${fLive}`,
  };
}

/* ============================================================
   HTML_TEMPLATE — social card (used by renderAnalysis)
   Paste this template literal into your renderAnalysis function.
   ============================================================ */
function renderSocialCard(sym) {
  const social = getSocialSentiment(sym);

  // SVG icons (inline, no external deps)
  const heartSvg    = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
  const rtSvg       = `<svg viewBox="0 0 24 24"><path d="M23.77 15.67c-.22-.22-.59-.22-.81 0l-1.76 1.76v-6.75c0-3.31-2.69-6-6-6h-3a.75.75 0 0 0 0 1.5h3c2.48 0 4.5 2.02 4.5 4.5v6.75l-1.76-1.76a.573.573 0 0 0-.81.81l2.72 2.72c.22.22.59.22.81 0l2.72-2.72c.23-.23.23-.59.39-.81zM8 19.5h-3c-2.48 0-4.5-2.02-4.5-4.5V8.25l1.76 1.76c.22.22.59.22.81 0 .22-.22.22-.59 0-.81L.35 6.48a.573.573 0 0 0-.81 0L-2.18 9.2a.573.573 0 0 0 .81.81L.39 8.25V15c0 3.31 2.69 6 6 6h3a.75.75 0 0 0 0-1.5z"/></svg>`;

  return `
<div class="social-card">
  <div class="section-label">
    <span class="x-logo">𝕏</span>
    Social Sentiment &middot; X (Twitter)
  </div>
  <div class="sr-labels">
    <span class="sr-bull-text">&#9650; Bullish ${social.bullPct}%</span>
    <span class="sr-bear-text">&#9660; Bearish ${social.bearPct}%</span>
  </div>
  <div class="sr-bar">
    <div class="sr-bull" style="flex:${social.bullPct}"></div>
    <div class="sr-bear" style="flex:${social.bearPct}"></div>
  </div>

  <div class="tweet-list">
    ${social.messages.map(m => `
    <div class="tweet">
      <div class="tweet-header">
        <div class="tweet-avatar">${m.user[0].toUpperCase()}</div>
        <span class="tweet-user">@${m.user}</span>
        ${m.verified ? '<span class="tweet-verified" title="Verified"></span>' : ''}
        <span class="tweet-sentiment ${m.bull ? 'bull' : 'bear'}">${m.bull ? '&#9650; Bullish' : '&#9660; Bearish'}</span>
      </div>
      <div class="tweet-text">${m.text}</div>
      <div class="tweet-actions">
        <span class="action">${heartSvg} ${m.likes.toLocaleString()}</span>
        <span class="action">${rtSvg} ${m.retweets.toLocaleString()}</span>
        <span class="tweet-ts">${m.ts}</span>
        <a class="tweet-xlink" href="${m.xLink}" target="_blank" rel="noopener">
          View on 𝕏 &#8599;
        </a>
      </div>
    </div>`).join('')}
  </div>

  <a class="x-search-btn" href="${social.searchLink}" target="_blank" rel="noopener">
    <span class="x-logo">𝕏</span>
    Search $${sym} on X (live feed)
  </a>
</div>`;
}

/* ── Mount demo widget ── */
const SYM = 'TSLA';
document.getElementById('socialMount').innerHTML = renderSocialCard(SYM);
</script>
</body>
</html>
