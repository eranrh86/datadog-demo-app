<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earnings Whisper Score — StockLens</title>

  <!-- ============================================================
       STYLES — complete dark-theme CSS using custom properties
       ============================================================ -->
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:          #0f172a;
      --card:        #1e293b;
      --card-inner:  #0f172a;
      --accent:      #3b82f6;
      --text:        #f1f5f9;
      --text-muted:  #64748b;
      --border:      #334155;
      --radius:      12px;
      --radius-sm:   6px;

      /* score color is injected by JS into the widget root */
      --score-color: #eab308;
      --score-rgb:   234,179,8;
    }

    /* ── Reset / base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      /* demo page only — widget itself has no body dependency */
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }

    /* ══════════════════════════════════════════════════════════════
       WIDGET ROOT
       ══════════════════════════════════════════════════════════════ */
    .ew-widget {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 400px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle accent glow on the top edge, tinted by score color */
    .ew-widget::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(var(--score-rgb), 0.8) 50%,
        transparent 100%);
      transition: background 0.6s ease;
    }

    /* ── Header row ── */
    .ew-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .ew-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .ew-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .ew-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Score + label row ── */
    .ew-score-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 4px;
    }

    .ew-score-number {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      color: var(--score-color);
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      transition: color 0.6s ease;
      min-width: 96px;  /* prevent layout shift during count-up */
    }

    .ew-score-meta {
      padding-bottom: 6px;
    }

    .ew-signal-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--score-color);
      transition: color 0.6s ease;
      line-height: 1.2;
    }

    .ew-signal-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Gauge bar ── */
    .ew-gauge-wrap {
      margin: 16px 0 20px;
    }

    .ew-gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .ew-gauge-track {
      position: relative;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg,
        #ef4444 0%,
        #f97316 20%,
        #eab308 40%,
        #eab308 60%,
        #22c55e 80%,
        #16a34a 100%);
      overflow: visible;
    }

    /* Dark overlay that masks from the right, revealing the fill left-to-right */
    .ew-gauge-mask {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      background: var(--card-inner);
      border-radius: 0 4px 4px 0;
      width: 100%;   /* starts fully covering; JS drives it to 0% from right */
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Needle / thumb */
    .ew-gauge-needle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--score-color);
      border: 2px solid var(--card);
      box-shadow: 0 0 0 2px rgba(var(--score-rgb), 0.4);
      transition: left 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.6s ease,
                  box-shadow 0.6s ease;
      z-index: 2;
    }

    /* Tick marks at −100, 0, +100 */
    .ew-gauge-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
    }

    .ew-gauge-tick {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ── Info row: earnings date + EPS ── */
    .ew-info-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .ew-info-chip {
      flex: 1;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .ew-info-chip-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .ew-info-chip-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .ew-info-chip-delta {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Factor breakdown ── */
    .ew-factors-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .ew-factors {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .ew-factor {
      display: grid;
      grid-template-columns: 120px 1fr 36px;
      align-items: center;
      gap: 8px;
    }

    .ew-factor-name {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ew-factor-track {
      height: 4px;
      border-radius: 2px;
      background: var(--card-inner);
      position: relative;
      overflow: hidden;
    }

    .ew-factor-fill {
      position: absolute;
      top: 0; bottom: 0;
      border-radius: 2px;
      width: 0;                 /* animated by JS */
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1) var(--delay, 0ms);
    }

    /* negative contributions go from center leftward (visual only) */
    .ew-factor-fill.positive {
      left: 50%;
      background: #22c55e;
    }

    .ew-factor-fill.negative {
      right: 50%;
      background: #ef4444;
    }

    /* center line */
    .ew-factor-track::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--border);
    }

    .ew-factor-value {
      font-size: 11px;
      font-weight: 600;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .ew-factor-value.positive { color: #22c55e; }
    .ew-factor-value.negative { color: #ef4444; }
    .ew-factor-value.neutral  { color: var(--text-muted); }

    /* ── Disclaimer ── */
    .ew-disclaimer {
      font-size: 10px;
      line-height: 1.5;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 4px;
    }

    /* ══════════════════════════════════════════════════════════════
       LOADING SKELETON
       ══════════════════════════════════════════════════════════════ */
    .ew-skeleton {
      display: none; /* shown by JS */
    }

    .ew-skeleton.ew-visible {
      display: block;
    }

    .ew-content.ew-hidden {
      display: none;
    }

    .ew-skel {
      background: linear-gradient(90deg, #1e293b 25%, #2d3f55 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .ew-skel-score   { height: 56px; width: 96px; margin-bottom: 12px; }
    .ew-skel-label   { height: 16px; width: 140px; margin-bottom: 4px; }
    .ew-skel-sub     { height: 12px; width: 80px; margin-bottom: 16px; }
    .ew-skel-gauge   { height: 8px; width: 100%; margin-bottom: 20px; }
    .ew-skel-chips   { display: flex; gap: 8px; margin-bottom: 20px; }
    .ew-skel-chip    { flex: 1; height: 50px; }
    .ew-skel-factor  { height: 4px; width: 100%; margin-bottom: 8px; }

    /* ══════════════════════════════════════════════════════════════
       ERROR STATE
       ══════════════════════════════════════════════════════════════ */
    .ew-error {
      display: none;
    }

    .ew-error.ew-visible {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 24px 0;
      text-align: center;
    }

    .ew-error-icon {
      font-size: 32px;
      line-height: 1;
    }

    .ew-error-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .ew-error-msg {
      font-size: 12px;
      color: var(--text-muted);
    }

    .ew-error-retry {
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .ew-error-retry:hover { opacity: 0.85; }

    /* ── Demo controls (not part of the widget spec) ── */
    .demo-controls {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .demo-controls input {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
    }

    .demo-controls input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .demo-controls button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .demo-controls button:hover { opacity: 0.85; }

    .demo-ticker-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .demo-ticker-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .demo-ticker-btn:hover,
    .demo-ticker-btn.active {
      border-color: var(--accent);
      color: var(--text);
    }

    .demo-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .demo-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <!-- ============================================================
       DEMO PAGE CHROME (not part of the widget itself)
       ============================================================ -->
  <div class="demo-wrapper">
    <div class="demo-label">StockLens — Stock Detail Panel</div>

    <div class="demo-controls">
      <input type="text" id="demo-ticker-input" placeholder="Enter ticker (e.g. AAPL)" maxlength="10" value="AAPL" />
      <button id="demo-load-btn">Load</button>
    </div>

    <div class="demo-ticker-list" id="demo-ticker-list">
      <button class="demo-ticker-btn active" data-symbol="AAPL">AAPL</button>
      <button class="demo-ticker-btn" data-symbol="NVDA">NVDA</button>
      <button class="demo-ticker-btn" data-symbol="TSLA">TSLA</button>
      <button class="demo-ticker-btn" data-symbol="MSFT">MSFT</button>
      <button class="demo-ticker-btn" data-symbol="AMZN">AMZN</button>
      <button class="demo-ticker-btn" data-symbol="META">META</button>
    </div>

    <br />

    <!-- ══════════════════════════════════════════════════════════
         THE ACTUAL WIDGET — copy everything inside #ew-container
         into the stock detail panel.
         ══════════════════════════════════════════════════════════ -->
    <div id="ew-container"></div>
  </div>


  <!-- ============================================================
       WIDGET TEMPLATE (cloned by renderEarningsWhisper)
       ============================================================ -->
  <template id="ew-template">
    <div class="ew-widget" role="region" aria-label="Earnings Whisper Score">

      <!-- Loading skeleton -->
      <div class="ew-skeleton ew-visible" aria-hidden="true">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div class="ew-skel" style="height:12px;width:120px;"></div>
          <div class="ew-skel" style="height:20px;width:80px;border-radius:20px;"></div>
        </div>
        <div class="ew-skel ew-skel-score"></div>
        <div class="ew-skel ew-skel-label"></div>
        <div class="ew-skel ew-skel-sub"></div>
        <div class="ew-skel ew-skel-gauge"></div>
        <div class="ew-skel-chips">
          <div class="ew-skel ew-skel-chip"></div>
          <div class="ew-skel ew-skel-chip"></div>
        </div>
        <div class="ew-skel ew-skel-factor"></div>
        <div class="ew-skel ew-skel-factor"></div>
        <div class="ew-skel ew-skel-factor"></div>
      </div>

      <!-- Error state -->
      <div class="ew-error" role="alert">
        <div class="ew-error-icon">⚠️</div>
        <div class="ew-error-title">Data Unavailable</div>
        <div class="ew-error-msg"></div>
        <button class="ew-error-retry">Retry</button>
      </div>

      <!-- Main content (hidden until data loads) -->
      <div class="ew-content ew-hidden">

        <!-- Header -->
        <div class="ew-header">
          <span class="ew-title">Earnings Whisper Score</span>
          <span class="ew-badge">
            <span class="ew-badge-dot"></span>
            <span class="ew-badge-symbol">—</span>
          </span>
        </div>

        <!-- Score + signal label -->
        <div class="ew-score-row">
          <div class="ew-score-number" aria-label="Score">0</div>
          <div class="ew-score-meta">
            <div class="ew-signal-label">—</div>
            <div class="ew-signal-sub">vs. analyst consensus</div>
          </div>
        </div>

        <!-- Horizontal gauge -->
        <div class="ew-gauge-wrap" aria-hidden="true">
          <div class="ew-gauge-labels">
            <span>Miss</span>
            <span>Neutral</span>
            <span>Beat</span>
          </div>
          <div class="ew-gauge-track">
            <div class="ew-gauge-mask"></div>
            <div class="ew-gauge-needle"></div>
          </div>
          <div class="ew-gauge-ticks">
            <span class="ew-gauge-tick">−100</span>
            <span class="ew-gauge-tick">0</span>
            <span class="ew-gauge-tick">+100</span>
          </div>
        </div>

        <!-- Info chips: earnings date + EPS -->
        <div class="ew-info-row">
          <div class="ew-info-chip">
            <div class="ew-info-chip-label">Next Earnings</div>
            <div class="ew-info-chip-value ew-earnings-date">—</div>
            <div class="ew-info-chip-delta ew-earnings-days"></div>
          </div>
          <div class="ew-info-chip">
            <div class="ew-info-chip-label">EPS Estimate</div>
            <div class="ew-info-chip-value ew-eps-estimate">—</div>
            <div class="ew-info-chip-delta ew-eps-prev"></div>
          </div>
        </div>

        <!-- Factor breakdown -->
        <div class="ew-factors-title">Signal Breakdown</div>
        <div class="ew-factors" aria-label="Factor contributions">
          <!-- injected by JS -->
        </div>

        <!-- Disclaimer -->
        <p class="ew-disclaimer">
          Earnings Whisper Score is a probabilistic model combining analyst revision trends,
          historical beat rates, options market sentiment, mean surprise magnitude, and short
          interest dynamics. Scores range from −100 (high miss probability) to +100 (high beat
          probability). Not financial advice. Past signals do not guarantee future results.
        </p>

      </div><!-- /.ew-content -->
    </div><!-- /.ew-widget -->
  </template>


  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
  /* ----------------------------------------------------------------
     Color helpers
     ---------------------------------------------------------------- */
  function scoreToColor(score) {
    // Green  ≥ +40
    // Yellow  −20 … +39
    // Red    ≤ −21
    if (score >= 40)  return { hex: '#22c55e', rgb: '34,197,94'  };
    if (score >= 20)  return { hex: '#86efac', rgb: '134,239,172'};
    if (score >= -19) return { hex: '#eab308', rgb: '234,179,8'  };
    if (score >= -40) return { hex: '#f97316', rgb: '249,115,22' };
    return                   { hex: '#ef4444', rgb: '239,68,68'  };
  }

  function scoreToSignal(score) {
    if (score >= 60)  return 'Strong Beat Expected';
    if (score >= 25)  return 'Likely Beat';
    if (score >= -24) return 'Coin Flip';
    if (score >= -59) return 'Likely Miss';
    return 'Strong Miss';
  }

  /* ----------------------------------------------------------------
     Count-up animation for the score number
     ---------------------------------------------------------------- */
  function animateCountUp(el, targetScore, duration = 1200) {
    const start = performance.now();
    const from  = 0;

    function step(now) {
      const elapsed  = now - start;
      const progress = Math.min(elapsed / duration, 1);
      // ease-out cubic
      const eased    = 1 - Math.pow(1 - progress, 3);
      const current  = Math.round(from + (targetScore - from) * eased);

      el.textContent = (current > 0 ? '+' : '') + current;

      if (progress < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  }

  /* ----------------------------------------------------------------
     Factor name map
     ---------------------------------------------------------------- */
  const FACTOR_LABELS = {
    analyst_revisions: 'Analyst Revisions',
    beat_history:      'Beat History',
    options_signal:    'Options Signal',
    surprise_size:     'Surprise Size',
    short_interest:    'Short Interest',
  };

  /* ----------------------------------------------------------------
     Main render function — PUBLIC API
     ----------------------------------------------------------------
     Usage:
       renderEarningsWhisper('AAPL', 'ew-container');

     endpoint: GET /api/stock/{symbol}/earnings-whisper
     ---------------------------------------------------------------- */
  function renderEarningsWhisper(symbol, containerId) {
    const container = document.getElementById(containerId);
    if (!container) { console.error('[EW] Container not found:', containerId); return; }

    // Clone template
    const tpl   = document.getElementById('ew-template');
    const node  = tpl.content.cloneNode(true);
    const widget = node.querySelector('.ew-widget');

    container.innerHTML = '';
    container.appendChild(node);

    const wEl = container.querySelector('.ew-widget');

    // -- helper selectors scoped to this widget instance
    const $ = (sel) => wEl.querySelector(sel);

    const skeletonEl  = $('.ew-skeleton');
    const errorEl     = $('.ew-error');
    const contentEl   = $('.ew-content');
    const retryBtn    = $('.ew-error-retry');

    function showSkeleton() {
      skeletonEl.classList.add('ew-visible');
      errorEl.classList.remove('ew-visible');
      contentEl.classList.add('ew-hidden');
    }

    function showError(msg) {
      skeletonEl.classList.remove('ew-visible');
      contentEl.classList.add('ew-hidden');
      errorEl.classList.add('ew-visible');
      errorEl.querySelector('.ew-error-msg').textContent = msg || 'Could not load earnings data.';
    }

    function renderData(data) {
      const { score, factors, earnings_date, eps_estimate, eps_previous, symbol: sym } = data;

      // Color scheme
      const color = scoreToColor(score);
      wEl.style.setProperty('--score-color', color.hex);
      wEl.style.setProperty('--score-rgb',   color.rgb);

      // Header badge
      $('.ew-badge-symbol').textContent = sym;

      // Score number (count-up)
      const scoreEl = $('.ew-score-number');
      scoreEl.textContent = '0';
      animateCountUp(scoreEl, score);

      // Signal label
      $('.ew-signal-label').textContent = scoreToSignal(score);

      // Gauge
      //   score −100 maps to left=0%, score +100 maps to left=100%
      const pct = ((score + 100) / 200) * 100; // 0-100%

      // The mask covers from right. Un-revealed portion = (100 - pct)%.
      // We start at 100% width and animate to (100 - pct)%.
      const maskEl   = $('.ew-gauge-mask');
      const needleEl = $('.ew-gauge-needle');
      maskEl.style.width   = '100%';
      needleEl.style.left  = '0%';

      requestAnimationFrame(() => {
        // Trigger transition after paint
        setTimeout(() => {
          maskEl.style.width  = (100 - pct) + '%';
          needleEl.style.left = pct + '%';
        }, 80);
      });

      // Earnings date chip
      const edDate   = new Date(earnings_date + 'T00:00:00');
      const today    = new Date();
      today.setHours(0, 0, 0, 0);
      const daysOut  = Math.round((edDate - today) / 86400000);
      const edStr    = edDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      $('.ew-earnings-date').textContent = edStr;
      $('.ew-earnings-days').textContent = daysOut === 0
        ? 'Today'
        : daysOut === 1
          ? 'Tomorrow'
          : `In ${daysOut} days`;

      // EPS chip
      const epsDelta = eps_estimate - eps_previous;
      const epsSign  = epsDelta >= 0 ? '+' : '';
      $('.ew-eps-estimate').textContent = `$${eps_estimate.toFixed(2)}`;
      $('.ew-eps-prev').textContent     = `${epsSign}$${epsDelta.toFixed(2)} vs prev`;

      // Factors
      const factorsEl = $('.ew-factors');
      factorsEl.innerHTML = '';

      const factorKeys = Object.keys(FACTOR_LABELS);
      factorKeys.forEach((key, idx) => {
        const val   = factors[key] ?? 0;
        const isPos = val >= 0;
        const absPct = Math.min(Math.abs(val) / 30 * 50, 50); // max 50% from center

        const delay  = idx * 80; // stagger delay in ms

        const row  = document.createElement('div');
        row.className = 'ew-factor';
        row.innerHTML = `
          <span class="ew-factor-name">${FACTOR_LABELS[key]}</span>
          <div class="ew-factor-track">
            <div class="ew-factor-fill ${isPos ? 'positive' : 'negative'}"
                 style="width:0%;--delay:${delay}ms"></div>
          </div>
          <span class="ew-factor-value ${isPos ? 'positive' : val === 0 ? 'neutral' : 'negative'}">
            ${isPos ? '+' : ''}${val}
          </span>
        `;
        factorsEl.appendChild(row);

        // Animate bar width after append
        requestAnimationFrame(() => {
          setTimeout(() => {
            row.querySelector('.ew-factor-fill').style.width = absPct + '%';
          }, 100 + delay);
        });
      });

      // Show content
      skeletonEl.classList.remove('ew-visible');
      errorEl.classList.remove('ew-visible');
      contentEl.classList.remove('ew-hidden');
    }

    function load(sym) {
      showSkeleton();
      fetch(`/api/stock/${encodeURIComponent(sym)}/earnings-whisper`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          return res.json();
        })
        .then(data => renderData(data))
        .catch(err => {
          console.error('[EW] Fetch error:', err);
          showError(`${err.message}. Check your connection or try again.`);
        });
    }

    // Wire retry button
    retryBtn.addEventListener('click', () => load(symbol));

    // Initial load
    load(symbol);
  }

  /* ----------------------------------------------------------------
     DEMO PAGE WIRING — not part of the widget contract
     ---------------------------------------------------------------- */
  (function initDemo() {
    let currentSymbol = 'AAPL';

    function loadSymbol(sym) {
      sym = sym.trim().toUpperCase();
      if (!sym) return;
      currentSymbol = sym;
      document.getElementById('demo-ticker-input').value = sym;

      // Update active ticker button
      document.querySelectorAll('.demo-ticker-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.symbol === sym);
      });

      renderEarningsWhisper(sym, 'ew-container');
    }

    document.getElementById('demo-load-btn').addEventListener('click', () => {
      loadSymbol(document.getElementById('demo-ticker-input').value);
    });

    document.getElementById('demo-ticker-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadSymbol(e.target.value);
    });

    document.getElementById('demo-ticker-list').addEventListener('click', e => {
      const btn = e.target.closest('.demo-ticker-btn');
      if (btn) loadSymbol(btn.dataset.symbol);
    });

    // Initial render
    loadSymbol(currentSymbol);
  })();
  </script>

</body>
